name: Mongrel Surveyor checks

on:
  push:
    branches:
      - 'feature/mongrel-surveyor-*'
      - 'feature/surveyor-live-test-*'
  pull_request:
    paths:
      - 'downloads/mongrel-scout/**'
      - 'scripts/test-scout-mission-sync.py'
      - 'scripts/test_surveyor.py'
      - 'scripts/test_surveyor_bio.py'
      - 'scripts/test_surveyor_bio_predictions.py'
      - 'scripts/test_surveyor_bio_hud.py'
      - 'scripts/test_surveyor_bio_pipeline.py'
      - 'scripts/test_surveyor_bio_live_fixes.py'
      - 'scripts/test_surveyor_bio_workflow.py'
      - 'scripts/test_surveyor_bio_prices.py'
      - 'scripts/test_surveyor_codex_variant.py'
      - 'scripts/test-surveyor-bio-controller.mjs'
      - 'downloads/mongrel-hud/**'
      - 'scripts/test_surveyor_history.py'
      - 'scripts/test_surveyor_expedition.py'
      - 'scripts/test_surveyor_live_feedback.py'
      - 'scripts/test_surveyor_multistar_discovery.py'
      - 'scripts/test_surveyor_compact_log.py'
      - 'scripts/test_surveyor_eddiscovery_reference.py'
      - 'scripts/test_surveyor_eddiscovery_bridge.py'
      - 'scripts/test_surveyor_advisor.py'
      - 'scripts/test_surveyor_advisor_hud.py'
      - '.github/workflows/surveyor-checks.yml'

jobs:
  surveyor-journal-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax and compilation
        run: python -m py_compile downloads/mongrel-scout/load.py downloads/mongrel-scout/surveyor.py downloads/mongrel-scout/surveyor_intel.py downloads/mongrel-scout/surveyor_history.py downloads/mongrel-scout/surveyor_edd_bridge.py downloads/mongrel-scout/mission_sync.py scripts/test-scout-mission-sync.py scripts/test_surveyor.py scripts/test_surveyor_bio.py scripts/test_surveyor_bio_predictions.py scripts/test_surveyor_bio_hud.py scripts/test_surveyor_bio_pipeline.py scripts/test_surveyor_bio_live_fixes.py scripts/test_surveyor_bio_workflow.py scripts/test_surveyor_bio_prices.py scripts/test_surveyor_codex_variant.py scripts/test_surveyor_intel.py scripts/test_surveyor_history.py scripts/test_surveyor_advisor.py scripts/test_surveyor_advisor_hud.py scripts/test_surveyor_expedition.py scripts/test_surveyor_live_feedback.py scripts/test_surveyor_multistar_discovery.py scripts/test_surveyor_eddiscovery_reference.py scripts/test_surveyor_eddiscovery_bridge.py downloads/mongrel-hud/mongrel_hud.py
      - name: Test persistent exploration ledger
        run: |
          python scripts/test-scout-mission-sync.py
          python scripts/test_surveyor.py
          python scripts/test_surveyor_bio.py
          python scripts/test_surveyor_bio_predictions.py
          python scripts/test_surveyor_bio_hud.py
          python scripts/test_surveyor_bio_pipeline.py
          python scripts/test_surveyor_bio_live_fixes.py
          python scripts/test_surveyor_bio_workflow.py
          python scripts/test_surveyor_bio_prices.py
          python scripts/test_surveyor_codex_variant.py
          node scripts/test-surveyor-bio-controller.mjs
          python scripts/test_surveyor_intel.py
          python scripts/test_surveyor_history.py
          python scripts/test_surveyor_advisor.py
          python scripts/test_surveyor_advisor_hud.py
          python scripts/test_surveyor_expedition.py
          python scripts/test_surveyor_live_feedback.py
          python scripts/test_surveyor_multistar_discovery.py
          python scripts/test_surveyor_compact_log.py
          python scripts/test_surveyor_eddiscovery_reference.py
          python scripts/test_surveyor_eddiscovery_bridge.py

