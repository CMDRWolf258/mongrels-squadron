name: Diagnose Rivers Hub

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/diagnose-rivers-hub.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Query live station host diagnostic
        shell: bash
        run: |
          set -euo pipefail
          URL='https://mongrels-squadron.pages.dev/api/orrery/station-host-diagnostics?systemId64=560820275507&marketId=4391607555'
          for attempt in $(seq 1 40); do
            body="$(curl -sS --max-time 10 -w $'\n%{http_code}' "$URL" || true)"
            code="$(printf '%s\n' "$body" | tail -n1)"
            payload="$(printf '%s\n' "$body" | sed '$d')"
            if [ "$code" = "200" ]; then
              echo "HTTP $code"
              echo "$payload"
              exit 0
            fi
            echo "attempt=$attempt http=$code"
            sleep 3
          done
          echo "Live diagnostic endpoint did not return HTTP 200" >&2
          exit 1

      - name: Query Spansh station and system data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request

          headers={"User-Agent":"Mongrels-Squadron/1.0 station-host-diagnostic"}
          def get(url):
              req=urllib.request.Request(url,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.load(r)

          station=get("https://spansh.co.uk/api/station/4391607555")
          print("SPANSH_STATION")
          print(json.dumps(station,indent=2,sort_keys=True)[:30000])

          system=get("https://spansh.co.uk/api/system/560820275507")
          matches=[]
          def walk(value,path="root"):
              if isinstance(value,dict):
                  if str(value.get("id",""))=="4391607555" or value.get("name")=="Rivers Hub":
                      matches.append((path,value))
                  for k,v in value.items():
                      walk(v,f"{path}.{k}")
              elif isinstance(value,list):
                  for i,v in enumerate(value):
                      walk(v,f"{path}[{i}]")
          walk(system)
          print("SPANSH_SYSTEM_MATCHES")
          print(json.dumps(matches,indent=2,sort_keys=True)[:30000])
          PY
