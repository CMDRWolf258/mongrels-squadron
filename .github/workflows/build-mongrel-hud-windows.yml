name: Build Mongrel HUD Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'downloads/mongrel-hud/**'
      - '.github/workflows/build-mongrel-hud-windows.yml'

permissions:
  contents: write

concurrency:
  group: mongrel-hud-windows
  cancel-in-progress: true

jobs:
  release-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm Scout/HUD stable versions, complete website ZIP contents and syntax
        run: |
          python -m py_compile downloads/mongrel-scout/load.py downloads/mongrel-scout/mission_sync.py downloads/mongrel-scout/surveyor.py downloads/mongrel-scout/surveyor_history.py downloads/mongrel-scout/surveyor_intel.py downloads/mongrel-scout/surveyor_edd_bridge.py downloads/mongrel-hud/mongrel_hud.py
          node scripts/smoke-mongrel-scout.mjs
          python scripts/smoke-mongrel-hud-companion.py
          python scripts/smoke-mongrel-hud.py
          node scripts/smoke-mongrel-hud-controller.mjs
      - name: Exercise Frontier journal, biology, expedition, navigation and cross-PC cargo
        run: |
          python scripts/test-scout-mission-sync.py
          python scripts/test_surveyor.py
          python scripts/test_surveyor_bio.py
          python scripts/test_surveyor_bio_predictions.py
          python scripts/test_surveyor_bio_hud.py
          python scripts/test_surveyor_bio_pipeline.py
          python scripts/test_surveyor_bio_live_fixes.py
          python scripts/test_surveyor_bio_workflow.py
          python scripts/test_surveyor_bio_prices.py
          python scripts/test_surveyor_codex_variant.py
          python scripts/test_surveyor_expedition.py
          python scripts/test_surveyor_history.py
          python scripts/test_surveyor_multistar_discovery.py
          python scripts/test_surveyor_compact_log.py
          node scripts/test-surveyor-log-controller.mjs
          python scripts/test_surveyor_eddiscovery_reference.py
          python scripts/test_surveyor_eddiscovery_bridge.py
          node scripts/test-surveyor-bio-controller.mjs

  build:
    needs: release-qualification
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check pyinstaller pillow "rapidocr-onnxruntime==1.4.4" zeroconf

      - name: Build standalone executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name MongrelHUD --collect-all rapidocr_onnxruntime --collect-all onnxruntime --collect-all zeroconf --add-data "downloads/mongrel-hud/controller.html;." downloads/mongrel-hud/mongrel_hud.py
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/MongrelHUD.exe package/MongrelHUD.exe
          Copy-Item downloads/mongrel-hud/README.md package/README.md
          Compress-Archive -Path package/* -DestinationPath MongrelHUD-Windows.zip -Force

      - name: Publish rolling Windows build
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $match = Select-String -Path "downloads/mongrel-hud/mongrel_hud.py" -Pattern 'APP_VERSION = "([^"]+)"'
          if (-not $match -or -not $match.Matches.Count) { throw "Could not read APP_VERSION" }
          $version = $match.Matches[0].Groups[1].Value
          $title = "Mongrel HUD Windows v$version"
          $notes = "Rolling Windows build for Mongrel HUD. Current version: $version."
          gh release view mongrel-hud-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create mongrel-hud-latest --title "Mongrel HUD Windows" --notes "Rolling Windows build for Mongrel HUD."
          }
          # Publish the verified asset first. Only advertise the new version after
          # the clobber has completed so clients never see new metadata with an old ZIP.
          gh release upload mongrel-hud-latest MongrelHUD-Windows.zip --clobber
          gh release edit mongrel-hud-latest --title $title --notes $notes
