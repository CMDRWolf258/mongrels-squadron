name: Site smoke tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - 'data/live-bgs.json'

permissions:
  contents: read

concurrency:
  group: site-smoke-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Parse JavaScript
        run: |
          find functions lib js -type f -name '*.js' -print0 | xargs -0 -n1 node --experimental-default-type=module --check

      - name: Run smoke checks
        run: |
          node --experimental-default-type=module scripts/smoke-test.mjs
          node --experimental-default-type=module scripts/smoke-daily-orders.mjs
          node --experimental-default-type=module scripts/smoke-daily-order-cycles.mjs
          node --experimental-default-type=module scripts/smoke-mission-origin.mjs
          node --experimental-default-type=module scripts/smoke-daily-order-baseline.mjs
          node --experimental-default-type=module scripts/smoke-exobiology.mjs
          node --experimental-default-type=module scripts/smoke-pve.mjs
          node --experimental-default-type=module scripts/smoke-pvp.mjs
          node --experimental-default-type=module scripts/smoke-operations.mjs
          node --experimental-default-type=module scripts/smoke-colonization.mjs
          node --experimental-default-type=module scripts/smoke-trade-intelligence.mjs
          node --experimental-default-type=module scripts/smoke-colonization-jobs.mjs
          node --experimental-default-type=module scripts/smoke-colonization-discord.mjs
          node --experimental-default-type=module scripts/smoke-colonization-rewards.mjs
          node --experimental-default-type=module scripts/smoke-member-colonization-posts.mjs
          node --experimental-default-type=module scripts/smoke-member-colonization-posts.mjs
          node --experimental-default-type=module scripts/smoke-reward-issue.mjs
          node --experimental-default-type=module scripts/smoke-reward-payments.mjs
          node --experimental-default-type=module scripts/smoke-member-rewards.mjs
          node --experimental-default-type=module scripts/smoke-kv-list-efficiency.mjs
          node --experimental-default-type=module scripts/smoke-squadron-coordination.mjs
          node --experimental-default-type=module scripts/smoke-resources.mjs
          node --experimental-default-type=module scripts/smoke-wolf-bgs.mjs
          node --experimental-default-type=module scripts/smoke-wolf-bgs-contribution-options.mjs
          node --experimental-default-type=module scripts/smoke-wolf-bgs-health.mjs
          node --experimental-default-type=module scripts/smoke-wolf-bgs-screenshot.mjs
          node --experimental-default-type=module scripts/smoke-mongrel-scout.mjs
          node --experimental-default-type=module scripts/smoke-scout-jobs.mjs
          node --experimental-default-type=module scripts/smoke-frontier-diagnostics.mjs
          node --experimental-default-type=module scripts/smoke-frontier-auto-sync.mjs
          node --experimental-default-type=module scripts/smoke-scout-discord.mjs
          node --experimental-default-type=module scripts/smoke-bgs-discord.mjs
          node --experimental-default-type=module scripts/smoke-reward-discord.mjs
          node --experimental-default-type=module scripts/smoke-discord-webhook.mjs
          node --experimental-default-type=module scripts/smoke-announcements.mjs
          node --experimental-default-type=module scripts/smoke-squad-events.mjs
          node --experimental-default-type=module scripts/smoke-squad-structure.mjs
          node --experimental-default-type=module scripts/smoke-pursuits.mjs
          node --experimental-default-type=module scripts/smoke-combat-escort.mjs
          node --experimental-default-type=module scripts/smoke-training-resources-discord.mjs
          node --experimental-default-type=module scripts/smoke-squad-rules.mjs
          node --experimental-default-type=module scripts/smoke-pursuits.mjs
          node --experimental-default-type=module scripts/smoke-gallery-submissions.mjs
          node --experimental-default-type=module scripts/smoke-daily-orders-discord.mjs
          python3 -m py_compile downloads/mongrel-scout/load.py
