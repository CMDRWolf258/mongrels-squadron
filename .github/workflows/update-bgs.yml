name: Refresh BGS data

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_bgs.py'
      - 'scripts/enrich_bgs_boards.py'
      - '.github/workflows/update-bgs.yml'
  schedule:
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-bgs-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh EliteHub Vault presence snapshot
        env:
          ELITEHUB_VAULT_API_KEY: ${{ secrets.ELITEHUB_VAULT_API_KEY }}
        run: python scripts/update_bgs.py

      - name: Refresh EliteHub Vault full faction boards
        env:
          ELITEHUB_VAULT_API_KEY: ${{ secrets.ELITEHUB_VAULT_API_KEY }}
        run: python scripts/enrich_bgs_boards.py

      - name: Commit updated snapshots
        shell: bash
        run: |
          if git diff --quiet -- data/live-bgs.json data/live-bgs-boards.json; then
            echo "No BGS snapshot changes to commit."
            exit 0
          fi

          git config user.name "mongrels-bgs-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live-bgs.json data/live-bgs-boards.json
          git commit -m "chore: refresh BGS data"

          # A refresh can take long enough for an unrelated site commit to land on
          # main. Rebase the data-only commit onto the newest main before pushing
          # instead of failing with a non-fast-forward rejection.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              echo "BGS data rebase conflicted; refusing to overwrite newer data."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced another main update; retrying ($attempt/3)..."
            sleep 2
          done

          echo "Could not push refreshed BGS data after three safe rebase attempts."
          exit 1
